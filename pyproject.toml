[project]
name = "podcast-job-finder"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.6.17",
    "cryptography>=49.0.0",
    "doubaoime-asr",
    "numpy>=2.4.1",
    "openai>=2.15.0",
    "requests>=2.34.2",
    "ten-vad>=1.0.6.8",
]

[project.scripts]
# 下载小宇宙单集 URL 对应的原始音频，支持指定目录、跳过已有文件或强制覆盖。
# 输出范围为下载结果和原始音频文件；语音切分、模型转写和公司提取由后续命令负责。
podcast-download-audio = "podcast_job_finder.cli.download_audio:main"
# 单集 URL 基于页面提取公司；pid 批量支持页面/音频来源、断点续跑和结果汇总。
# send-code、login、pid 依赖本地 xyz；pid 音频来源完成下载、切分、逐片段转写和公司提取。
podcast-find-jobs = "podcast_job_finder.cli.companies:main"
# 抓取并输出小宇宙单集的标题、正文、评论和音频地址，便于检查页面解析结果。
# 输出范围为页面解析文本；音频下载和模型处理由对应命令负责。
podcast-inspect-episode = "podcast_job_finder.cli.inspect_episode:main"
# 将本地音频规范化后使用 TEN VAD 检测人声，并导出多个 WAV 语音片段及片段清单。
# 输出范围为 WAV 片段与片段清单；转写文本由 podcast-transcribe 生成。
podcast-split-audio = "podcast_job_finder.cli.split_audio:main"
# 切分本地音频并逐片段调用大语言模型转写，生成同名 JSON 检查点和完整 JSON 结果。
# 支持缓存复用、限制片段数量和强制重写；模型接口范围为 chat.completions。
podcast-transcribe = "podcast_job_finder.cli.transcribe:main"
# 将已有的片段 JSON 或完整转写 JSON 交给转写模型整理，生成便于阅读的 Markdown 文章。
# 该命令不读取音频，使用独立的 LLM_TRANSCRIPTION_FORMATTING 模型配置。
podcast-merge-transcriptions = "podcast_job_finder.cli.merge_transcriptions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=3.0.0",
  "pylint>=4.0.6",
  "pyright>=1.1.411",
]

[tool.mypy]
python_version = "3.14"
files = ["."]
warn_unreachable = true
exclude = '(^\.venv/|^output/|^\.git/|^\.mypy_cache/|^\.ruff_cache/)'

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
  "C90",
  "E4",
  "E7",
  "E9",
  "F",
  "SIM",
]
ignore = [
  "SIM105",
  "SIM108",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.vulture]
paths = ["."]
exclude = [
  "*/.venv/*",
  "*/output/*",
]
min_confidence = 60
sort_by_size = true

[tool.uv.sources]
doubaoime-asr = { path = "../doubaoime-asr" }
